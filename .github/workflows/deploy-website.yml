name: Publicar site do ateliê

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-github-pages
  cancel-in-progress: false

jobs:
  preparar:
    name: Validar e preparar o site
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obter código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validar JavaScript e gerar artefato estático
        run: |
          node --check website/js/main.js
          node --check website/js/animations.js
          python3 website/scripts/publicar.py --saida "$RUNNER_TEMP/atelie-publico"
          test -s "$RUNNER_TEMP/atelie-publico/index.html"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar apenas o artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/atelie-publico

  publicar:
    name: Publicar no GitHub Pages
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar artefato
        id: deploy
        uses: actions/deploy-pages@v4
